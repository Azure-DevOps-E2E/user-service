trigger:
  branches:
    include:
    - '*'

pr:
  branches:
    include:
    - '*'

resources:
  repositories:
  - repository: configTemplates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

pool:
  vmImage: ubuntu-latest

stages:
- template: pipelines/templates/service-stages.yml@configTemplates
  parameters:
    serviceName: user-service
    imageName: user-service
    dockerfilePath: Dockerfile
    containerRegistry: acrLoginServer
    qualitySteps:
    - task: GoTool@0
      displayName: 'Use Go 1.26.5'
      inputs:
        version: '1.26.5'

    - bash: |
        set -euo pipefail
        go vet ./...
        go test ./...
        go build ./...
      displayName: 'Vet, test, and build'
