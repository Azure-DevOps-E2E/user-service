trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github-azure-devops-e2e
      name: Azure-DevOps-E2E/platform
      ref: refs/heads/main

extends:
  template: pipelines/templates/service-pipeline.yml@templates
  parameters:
    serviceName: user-service
    imageRepository: user-service
    dockerfilePath: Dockerfile
    testCommand: |
      go test ./...
