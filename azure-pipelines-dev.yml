trigger:
  batch: true
  branches:
    include:
    - dev

pr: none

resources:
  repositories:
  - repository: templates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

variables:
- group: nexuscart-shared
- name: serviceName
  value: 'user-service'
- name: imageRepository
  value: 'user-service'
- name: dockerfilePath
  value: '$(Build.SourcesDirectory)/Dockerfile'
- name: buildContext
  value: '$(Build.SourcesDirectory)'
- name: goVersion
  value: '1.26.6'
- name: testResultsFile
  value: '$(System.DefaultWorkingDirectory)/reports/test-results.xml'
- name: coverageSummaryFile
  value: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
- name: trivyVersion
  value: '0.72.0'
- name: candidateTag
  value: '$(Build.SourceVersion)'

pool:
  name: mcs

extends:
  template: pipelines/templates/pipeline-contract.yml@templates
  parameters:
    pipelineStages:
    - stage: CI
      displayName: 'CI - $(serviceName)'
      jobs:
      - job: Quality
        displayName: 'Test and build $(serviceName)'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          displayName: 'Checkout source code'

        # Host Go setup is kept commented for rollback. Quality now runs in Docker.
        # - task: GoTool@0
        #   displayName: 'Use Go $(goVersion)'
        #   inputs:
        #     version: '$(goVersion)'
        #
        # - template: steps/go/test.yml@templates
        #   parameters:
        #     testResultsFile: reports/test-results.xml
        #     coverageReportFile: coverage/cobertura-coverage.xml
        #
        # - template: steps/go/verify.yml@templates

        - template: steps/container/prepare-build-image.yml@templates
          parameters:
            runtime: go
            version: '$(goVersion)'

        - template: steps/go/quality-container.yml@templates
          parameters:
            cacheKey: '$(serviceName)-go$(goVersion)'
            testResultsFile: reports/test-results.xml
            coverageReportFile: coverage/cobertura-coverage.xml

        - task: PublishTestResults@2
          displayName: 'Publish test report'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(testResultsFile)'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            mergeTestResults: true
            failTaskOnFailedTests: true
            failTaskOnFailureToPublishResults: true
            failTaskOnMissingResultsFile: true
            testRunTitle: '$(serviceName) tests'

        - task: UseDotNet@2
          displayName: 'Use .NET SDK for coverage publisher'
          condition: succeededOrFailed()
          inputs:
            packageType: sdk
            version: '8.x'

        - task: PublishCodeCoverageResults@2
          displayName: 'Publish coverage report'
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '$(coverageSummaryFile)'
            pathToSources: '$(Build.SourcesDirectory)'
            failIfCoverageEmpty: true

    - stage: BuildCandidate
      displayName: 'Build candidate - $(serviceName)'
      dependsOn: CI
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
      jobs:
      - job: BuildImage
        displayName: 'Build, scan, and push DEV candidate'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          displayName: 'Checkout source code'

        - task: Docker@2
          displayName: 'Build candidate image'
          inputs:
            command: build
            containerRegistry: 'acrLoginServer'
            repository: '$(imageRepository)'
            dockerfile: '$(dockerfilePath)'
            buildContext: '$(buildContext)'
            arguments: '--build-arg APP_VERSION=$(candidateTag)'
            tags: |
              $(candidateTag)
              dev

        - template: steps/container/scan.yml@templates
          parameters:
            scanImage: '$(acrLoginServer)/$(imageRepository):$(candidateTag)'
            trivyVersion: '$(trivyVersion)'

        - task: Docker@2
          displayName: 'Push candidate image'
          inputs:
            command: push
            containerRegistry: 'acrLoginServer'
            repository: '$(imageRepository)'
            tags: |
              $(candidateTag)
              dev

    # Direct AKS deployment and runtime verification stay disabled until the
    # cluster and public endpoints are provisioned.
    - stage: UpdateManifest
      displayName: 'Update DEV manifest - $(serviceName)'
      dependsOn: BuildCandidate
      condition: succeeded()
      jobs:
      - deployment: UpdateManifest
        displayName: 'Commit candidate tag to DEV values'
        environment: Development
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: templates
                clean: true
                fetchDepth: 0
                persistCredentials: true
                path: s/templates
                displayName: 'Checkout writable config repository'

              - bash: |
                  set -euo pipefail
                  bash "$(Pipeline.Workspace)/s/templates/scripts/update-manifest.sh" \
                    --service-name "$(serviceName)" \
                    --environment dev \
                    --registry "$(acrLoginServer)" \
                    --image-tag "$(candidateTag)" \
                    --repository-root "$(Pipeline.Workspace)/s/templates"
                name: updateManifest
                displayName: 'Update and push DEV manifest'
